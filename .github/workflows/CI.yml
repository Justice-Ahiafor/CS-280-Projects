name: GitHub Actions CI
run-name: Deploy javadocs and run tests.
on: [push]
jobs:
  Deploy-Docs:
    name: Deploy javadocs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install a compatible Java environment to GitHub's virtual machine.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Clone this repository to GitHub's virtual machine.
        uses: actions/checkout@v6
      - name: Build the javadocs on GitHub's virtual machine.
        run: javadoc -d docs -cp lib/* -sourcepath src -subpackages assignments
      - name: Deploy the docs directory on GitHub's virtual machine to this repository's gh-pages branch.
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
  Run-Tests:
    name: Run tests.
    runs-on: ubuntu-latest
    steps:
      - name: Install a compatible Java environment to GitHub's virtual machine.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Clone this repository to GitHub's virtual machine.
        uses: actions/checkout@v6
      - name: Run the project's Test.java file.
        run: java -cp lib/* -ea src/Test.java